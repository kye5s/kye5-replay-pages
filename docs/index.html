<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>kye5's meters checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🎯 kye5's Replay Checker</h1>

    <div class="upload">
      <input type="file" id="fileInput" accept=".replay" />
      <button id="parseBtn">Analyze Replay</button>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
<div class="tabs">
  <button onclick="showTab('upload')">Upload</button>
  <button onclick="showTab('leaderboard')">Leaderboard</button>
</div>

<div id="upload" class="tab">
  <!-- your existing upload UI -->
</div>

<div id="leaderboard" class="tab" style="display:none;">
  <h2>🏆 Furthest Kill Leaderboard</h2>
  <table id="leaderboard-table">
    <thead>
      <tr>
        <th>Distance (m)</th>
        <th>Player</th>
        <th>Weapon</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
