<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>kye5's meters checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🎯 kye5's Replay Checker</h1>

    <!-- Tabs -->
    <div class="tabs">
      <button onclick="showTab('upload')">Upload</button>
      <button onclick="showTab('leaderboard')">Leaderboard</button>
    </div>

    <!-- Upload tab -->
    <div id="upload" class="tab active">
      <div class="upload">
        <input type="file" id="fileInput" accept=".replay" />
        <button id="parseBtn">Analyze Replay</button>
      </div>
    </div>

    <!-- Results tab -->
    <div id="results" class="tab"></div>

    <!-- Leaderboard tab -->
    <div id="leaderboard" class="tab">
      <h2>🏆 Distance Leaderboard</h2>
      <table id="leaderboard-table">
        <thead>
          <tr>
            <th>Distance (m)</th>
            <th>Player</th>
            <th>Weapon</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
